<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP Gamer - App dos Alunos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    
    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    
    .logo {
      font-size: 2.5em;
      font-weight: bold;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .btn {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .message {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .dashboard {
      display: none;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }
    
    .stat-label {
      font-size: 0.9em;
      color: #666;
    }
    
    .ranking {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .ranking h3 {
      margin-bottom: 15px;
      color: #333;
    }
    
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }
    
    .ranking-item:last-child {
      border-bottom: none;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      .logo {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- TELA DE LOGIN -->
    <div id="loginScreen">
      <div class="logo">🎮 LP GAMER</div>
      <p class="subtitle">App para os Alunos</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="pin">PIN da Turma:</label>
          <input type="text" id="pin" value="2024" placeholder="Digite o PIN">
        </div>
        
        <div class="form-group">
          <label for="matricula">Matrícula:</label>
          <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
        </div>
        
        <div class="form-group">
          <label for="chamada">Número da Chamada:</label>
          <input type="number" id="chamada" placeholder="Digite seu número" required>
        </div>
        
        <button type="submit" class="btn" id="loginBtn">
          Entrar no Jogo
        </button>
      </form>
      
      <div id="message"></div>
    </div>
    
    <!-- TELA DO DASHBOARD (após login) -->
    <div id="dashboard" class="dashboard">
      <div class="logo">🏆 Dashboard</div>
      <p class="subtitle">Bem-vindo, <span id="nomeAluno"></span>!</p>
      
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="faseAtual">1</div>
          <div class="stat-label">Fase Atual</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pontosAtual">0</div>
          <div class="stat-label">Pontos</div>
        </div>
      </div>
      
      <div class="ranking" id="rankingContainer">
        <h3>🏅 Top 10 Ranking</h3>
        <div id="rankingList">Carregando ranking...</div>
      </div>
      
      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <script>
    // ⚠️ TROCAR PELA SUA URL REAL DO APPS SCRIPT:
    const API_URL = "https://lpgamer-proxy.vercel.app/api/proxy";
    
    let alunoLogado = null;
    
    // === FUNÇÃO DE LOGIN ===
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const pin = document.getElementById('pin').value;
      const matricula = document.getElementById('matricula').value;
      const chamada = document.getElementById('chamada').value;
      const btn = document.getElementById('loginBtn');
      
      if (!matricula || !chamada) {
        showMessage('Preencha todos os campos!', 'error');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      
      try {
        const response = await fetch(API_URL + '?fn=login', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ pin, matricula, chamada })
        });
        
        const data = await response.json();
        
        if (data.ok) {
          alunoLogado = data.aluno;
          showDashboard();
          showMessage('Login realizado com sucesso!', 'success');
          loadRanking();
        } else {
          showMessage(data.message || 'Erro no login', 'error');
        }
        
      } catch (error) {
        console.error('Erro:', error);
        showMessage('Erro de conexão. Verifique sua internet.', 'error');
      }
      
      btn.disabled = false;
      btn.textContent = 'Entrar no Jogo';
    });
    
    // === FUNÇÃO PARA CARREGAR RANKING ===
    async function loadRanking() {
      try {
        const response = await fetch(API_URL + '?fn=getRanking', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({})
        });
        
        const data = await response.json();
        
        if (data.ok && data.ranking) {
          const rankingHtml = data.ranking.map((aluno, index) => 
            `<div class="ranking-item">
              <span>${index + 1}° - ${aluno.nome} (${aluno.chamada})</span>
              <span>${aluno.pontos} pts</span>
            </div>`
          ).join('');
          
          document.getElementById('rankingList').innerHTML = rankingHtml;
        }
      } catch (error) {
        console.error('Erro ao carregar ranking:', error);
        document.getElementById('rankingList').innerHTML = 'Erro ao carregar ranking';
      }
    }
    
    // === FUNÇÕES DE INTERFACE ===
    function showMessage(message, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = message;
      messageDiv.className = `message ${type}`;
    }
    
    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      
      if (alunoLogado) {
        document.getElementById('nomeAluno').textContent = alunoLogado.nome;
        document.getElementById('faseAtual').textContent = alunoLogado.fase;
        document.getElementById('pontosAtual').textContent = alunoLogado.pontos;
      }
    }
    
    function logout() {
      alunoLogado = null;
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginForm').reset();
      document.getElementById('message').textContent = '';
      document.getElementById('pin').value = '2024';
    }
    
    // === TESTE DE CONEXÃO COM A API ===
    window.addEventListener('load', async function() {
      try {
        const response = await fetch(API_URL + '?fn=ping');
        const data = await response.json();
        console.log('API Status:', data);
      } catch (error) {
        console.warn('Erro ao testar API:', error);
        showMessage('Atenção: Verifique se a URL da API está correta!', 'error');
      }
    });
  </script>
</body>
</html>
