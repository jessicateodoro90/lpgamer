<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#1a1a2e">
    <title>LP Gamer - App dos Alunos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .logo {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .screen {
            display: none;
            flex: 1;
        }

        .screen.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9em;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #4CAF50;
            background: rgba(255, 255, 255, 0.15);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .user-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .user-avatar {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .user-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .user-status {
            font-size: 0.9em;
            opacity: 0.8;
            font-style: italic;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .fase-card {
            text-align: center;
            padding: 20px;
            margin-bottom: 15px;
        }

        .fase-card.locked {
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.05);
        }

        .fase-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .missoes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .missao-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .missao-title {
            font-size: 0.8em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .missao-nota {
            font-size: 1.2em;
            font-weight: 600;
        }

        .totals {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .total-item {
            text-align: center;
            flex: 1;
        }

        .total-label {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .total-value {
            font-size: 1.1em;
            font-weight: 600;
        }

        .ranking-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ranking-position {
            font-weight: 600;
            width: 30px;
        }

        .ranking-name {
            flex: 1;
            margin-left: 15px;
        }

        .ranking-points {
            font-weight: 600;
            color: #4CAF50;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            color: #ffcdd2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #f44336;
        }

        .success {
            background: rgba(76, 175, 80, 0.2);
            color: #c8e6c9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #4CAF50;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: #ffffff;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .emoji-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .emoji-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .emoji-btn:hover, .emoji-btn.selected {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .missoes-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* Fix para inputs em iOS */
        input[type="text"], input[type="number"], textarea {
            -webkit-appearance: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🎮</div>
            <div class="title">LP GAMER</div>
            <div class="subtitle">App dos Alunos</div>
        </div>

        <!-- Tela de Login -->
        <div id="loginScreen" class="screen active">
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 20px;">Entrar</h2>
                
                <div id="loginError" class="error" style="display: none;"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" class="form-control" placeholder="Digite sua matrícula" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="chamada">Nº Chamada</label>
                        <input type="text" id="chamada" class="form-control" placeholder="Digite seu número da chamada" required>
                    </div>
                    
                    <button type="submit" id="loginBtn" class="btn btn-primary">
                        <span id="loginBtnText">Entrar</span>
                        <span id="loginLoader" class="loading" style="display: none;"></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Tela Principal -->
        <div id="mainScreen" class="screen">
            <button class="back-btn" onclick="logout()">←</button>
            
            <div class="user-info card">
                <div class="user-avatar" id="userAvatar">😎😀😭</div>
                <div class="user-name" id="userName">Nome do Usuário</div>
                <div class="user-status" id="userStatus">Status do usuário</div>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="showFase(1)">FASE 1</button>
                <button class="btn btn-secondary" onclick="showFase(2)">FASE 2</button>
                <button class="btn btn-secondary" onclick="showFase(3)">FASE 3</button>
                <button class="btn btn-secondary" onclick="showRanking()">RANKING</button>
                <button class="btn btn-secondary" onclick="showPerfil()">MEU PERFIL</button>
                <button class="btn btn-secondary" onclick="showJogadores()">JOGADORES</button>
            </div>
        </div>

        <!-- Tela de Fase -->
        <div id="faseScreen" class="screen">
            <button class="back-btn" onclick="showMain()">←</button>
            
            <div id="faseContent" class="card fase-card">
                <!-- Conteúdo da fase será inserido dinamicamente -->
            </div>
        </div>

        <!-- Tela de Ranking -->
        <div id="rankingScreen" class="screen">
            <button class="back-btn" onclick="showMain()">←</button>
            
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 20px;">🏆 Ranking Fase 1</h2>
                <div id="rankingContent" class="ranking-list">
                    <!-- Ranking será inserido dinamicamente -->
                </div>
            </div>
        </div>

        <!-- Tela de Perfil -->
        <div id="perfilScreen" class="screen">
            <button class="back-btn" onclick="showMain()">←</button>
            
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 20px;">👤 Meu Perfil</h2>
                
                <div id="perfilError" class="error" style="display: none;"></div>
                <div id="perfilSuccess" class="success" style="display: none;"></div>
                
                <div class="form-group">
                    <label>Avatar (escolha até 3 emojis)</label>
                    <div class="emoji-picker">
                        <button type="button" class="emoji-btn" onclick="selectEmoji('😎')">😎</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('😀')">😀</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('😭')">😭</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('🚀')">🚀</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('⚡')">⚡</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('🔥')">🔥</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('💪')">💪</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('🎯')">🎯</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('🌟')">🌟</button>
                        <button type="button" class="emoji-btn" onclick="selectEmoji('👑')">👑</button>
                    </div>
                    <input type="text" id="avatarInput" class="form-control" placeholder="Seu avatar aparecerá aqui" readonly>
                </div>
                
                <div class="form-group">
                    <label for="statusInput">Status</label>
                    <textarea id="statusInput" class="form-control" rows="3" placeholder="Como você está se sentindo hoje?" maxlength="140"></textarea>
                </div>
                
                <button id="savePerfilBtn" class="btn btn-primary" onclick="savePerfil()">
                    <span id="savePerfilText">Salvar Perfil</span>
                    <span id="savePerfilLoader" class="loading" style="display: none;"></span>
                </button>
            </div>
        </div>

        <!-- Tela de Jogadores -->
        <div id="jogadoresScreen" class="screen">
            <button class="back-btn" onclick="showMain()">←</button>
            
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 20px;">👥 Jogadores</h2>
                <div id="jogadoresContent">
                    <!-- Lista de jogadores será inserida dinamicamente -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estado global
        let currentUser = null;
        let selectedEmojis = [];

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            // Configurar form de login
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                doLogin();
            });
            
            // Focar no primeiro input
            document.getElementById('matricula').focus();
        });

        // Funções de navegação
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showMain() {
            showScreen('mainScreen');
        }

        function logout() {
            currentUser = null;
            selectedEmojis = [];
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').style.display = 'none';
            showScreen('loginScreen');
        }

        // Login
        function doLogin() {
            const matricula = document.getElementById('matricula').value.trim();
            const chamada = document.getElementById('chamada').value.trim();
            
            if (!matricula || !chamada) {
                showError('loginError', 'Preencha todos os campos.');
                return;
            }

            setLoading('loginBtn', 'loginBtnText', 'loginLoader', true);
            hideError('loginError');

            google.script.run
                .withSuccessHandler(function(result) {
                    setLoading('loginBtn', 'loginBtnText', 'loginLoader', false);
                    
                    if (result.ok) {
                        currentUser = result.aluno;
                        updateUserInfo(result.aluno, result.profile);
                        showMain();
                    } else {
                        showError('loginError', result.message);
                    }
                })
                .withFailureHandler(function(error) {
                    setLoading('loginBtn', 'loginBtnText', 'loginLoader', false);
                    showError('loginError', 'Erro de conexão. Tente novamente.');
                    console.error('Login error:', error);
                })
                .login(matricula, chamada);
        }

        // Atualizar informações do usuário
        function updateUserInfo(aluno, profile) {
            document.getElementById('userName').textContent = aluno.nome;
            document.getElementById('userAvatar').textContent = profile.avatar || '😎😀😭';
            document.getElementById('userStatus').textContent = profile.status || 'Sem status definido';
        }

        // Mostrar fase
        function showFase(faseNum) {
            if (!currentUser) return;

            const content = document.getElementById('faseContent');
            content.innerHTML = '<div class="loading"></div>';
            showScreen('faseScreen');

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.ok) {
                        if (result.locked) {
                            content.innerHTML = `
                                <div class="fase-title">${result.message || 'FASE BLOQUEADA'}</div>
                                <p style="text-align: center; opacity: 0.7;">Esta fase ainda não foi liberada para você.</p>
                            `;
                            content.classList.add('locked');
                        } else {
                            renderFaseData(result);
                            content.classList.remove('locked');
                        }
                    } else {
                        content.innerHTML = `<div class="error">${result.message}</div>`;
                    }
                })
                .withFailureHandler(function(error) {
                    content.innerHTML = '<div class="error">Erro ao carregar fase. Tente novamente.</div>';
                    console.error('Fase error:', error);
                })
                .getFaseData(currentUser.matricula, currentUser.chamada, faseNum);
        }

        // Renderizar dados da fase
        function renderFaseData(data) {
            let html = `<div class="fase-title">${data.faseLabel}</div>`;
            
            if (data.missoes && data.missoes.length > 0) {
                html += '<div class="missoes-grid">';
                data.missoes.forEach(missao => {
                    html += `
                        <div class="missao-item">
                            <div class="missao-title">${missao.titulo}</div>
                            <div class="missao-nota">${missao.nota !== null ? missao.nota.toFixed(1) : '—'}</div>
                        </div>
                    `;
                });
                html += '</div>';
                
                html += '<div class="totals">';
                if (data.total1 !== undefined) {
                    html += `
                        <div class="total-item">
                            <div class="total-label">Total 1</div>
                            <div class="total-value">${data.total1 !== null ? data.total1.toFixed(1) : '—'}</div>
                        </div>
                    `;
                }
                if (data.extra !== undefined) {
                    html += `
                        <div class="total-item">
                            <div class="total-label">Extra</div>
                            <div class="total-value">${data.extra !== null ? data.extra.toFixed(1) : '—'}</div>
                        </div>
                    `;
                }
                if (data.total2 !== undefined) {
                    html += `
                        <div class="total-item">
                            <div class="total-label">Total 2</div>
                            <div class="total-value">${data.total2 !== null ? data.total2.toFixed(1) : '—'}</div>
                        </div>
                    `;
                }
                if (data.finalFase !== undefined) {
                    html += `
                        <div class="total-item">
                            <div class="total-label">Final</div>
                            <div class="total-value">${data.finalFase !== null ? data.finalFase.toFixed(1) : '—'}</div>
                        </div>
                    `;
                }
                if (data.notaFinal !== undefined) {
                    html += `
                        <div class="total-item">
                            <div class="total-label">Nota Final</div>
                            <div class="total-value">${data.notaFinal !== null ? data.notaFinal.toFixed(1) : '—'}</div>
                        </div>
                    `;
                }
                html += '</div>';
            }
            
            document.getElementById('faseContent').innerHTML = html;
        }

        // Mostrar ranking
        function showRanking() {
            const content = document.getElementById('rankingContent');
            content.innerHTML = '<div class="loading"></div>';
            showScreen('rankingScreen');

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.ok && result.ranking) {
                        let html = '';
                        result.ranking.forEach((item, index) => {
                            const position = index + 1;
                            const medal = position === 1 ? '🥇' : position === 2 ? '🥈' : position === 3 ? '🥉' : '';
                            
                            html += `
                                <div class="ranking-item">
                                    <div class="ranking-position">${medal} ${position}º</div>
                                    <div class="ranking-name">${item.nome}</div>
                                    <div class="ranking-points">${item.pontos.toFixed(1)}</div>
                                </div>
                            `;
                        });
                        content.innerHTML = html || '<p style="text-align: center;">Nenhum dado encontrado.</p>';
                    } else {
                        content.innerHTML = `<div class="error">${result.message || 'Erro ao carregar ranking'}</div>`;
                    }
                })
                .withFailureHandler(function(error) {
                    content.innerHTML = '<div class="error">Erro ao carregar ranking. Tente novamente.</div>';
                    console.error('Ranking error:', error);
                })
                .getRankingFase1();
        }

        // Mostrar perfil
        function showPerfil() {
            if (!currentUser) return;
            
            // Resetar seleção de emojis
            selectedEmojis = [];
            document.querySelectorAll('.emoji-btn').forEach(btn => btn.classList.remove('selected'));
            
            // Preencher campos com dados atuais
            const currentAvatar = document.getElementById('userAvatar').textContent;
            const currentStatus = document.getElementById('userStatus').textContent;
            
            document.getElementById('avatarInput').value = currentAvatar;
            document.getElementById('statusInput').value = currentStatus === 'Sem status definido' ? '' : currentStatus;
            
            // Marcar emojis atuais como selecionados
            if (currentAvatar) {
                const emojis = currentAvatar.match(/(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*)/gu) || [];
                emojis.forEach(emoji => {
                    selectedEmojis.push(emoji);
                    const btn = document.querySelector(`.emoji-btn[onclick="selectEmoji('${emoji.replace(/'/g, "\\'")}')"]`);
                    if (btn) btn.classList.add('selected');
                });
            }
            
            hideError('perfilError');
            hideError('perfilSuccess');
            showScreen('perfilScreen');
        }

        // Selecionar emoji
        function selectEmoji(emoji) {
            const btn = event.target;
            
            if (selectedEmojis.includes(emoji)) {
                // Remover emoji
                selectedEmojis = selectedEmojis.filter(e => e !== emoji);
                btn.classList.remove('selected');
            } else if (selectedEmojis.length < 3) {
                // Adicionar emoji
                selectedEmojis.push(emoji);
                btn.classList.add('selected');
            }
            
            document.getElementById('avatarInput').value = selectedEmojis.join('') || '👾';
        }

        // Salvar perfil
        function savePerfil() {
            if (!currentUser) return;
            
            const avatar = document.getElementById('avatarInput').value.trim();
            const status = document.getElementById('statusInput').value.trim();
            
            setLoading('savePerfilBtn', 'savePerfilText', 'savePerfilLoader', true);
            hideError('perfilError');
            hideError('perfilSuccess');
            
            // Salvar avatar
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.ok) {
                        // Salvar status
                        google.script.run
                            .withSuccessHandler(function(statusResult) {
                                setLoading('savePerfilBtn', 'savePerfilText', 'savePerfilLoader', false);
                                
                                if (statusResult.ok) {
                                    // Atualizar interface
                                    document.getElementById('userAvatar').textContent = avatar;
                                    document.getElementById('userStatus').textContent = status || 'Sem status definido';
                                    
                                    showSuccess('perfilSuccess', 'Perfil salvo com sucesso!');
                                } else {
                                    showError('perfilError', statusResult.message);
                                }
                            })
                            .withFailureHandler(function(error) {
                                setLoading('savePerfilBtn', 'savePerfilText', 'savePerfilLoader', false);
                                showError('perfilError', 'Erro ao salvar status. Tente novamente.');
                                console.error('Save status error:', error);
                            })
                            .saveStatus(currentUser.matricula, currentUser.chamada, status);
                    } else {
                        setLoading('savePerfilBtn', 'savePerfilText', 'savePerfilLoader', false);
                        showError('perfilError', result.message);
                    }
                })
                .withFailureHandler(function(error) {
                    setLoading('savePerfilBtn', 'savePerfilText', 'savePerfilLoader', false);
                    showError('perfilError', 'Erro ao salvar avatar. Tente novamente.');
                    console.error('Save avatar error:', error);
                })
                .saveAvatar(currentUser.matricula, currentUser.chamada, avatar);
        }

        // Mostrar jogadores
        function showJogadores() {
            const content = document.getElementById('jogadoresContent');
            content.innerHTML = '<div class="loading"></div>';
            showScreen('jogadoresScreen');

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.ok && result.jogadores) {
                        let html = '';
                        result.jogadores.forEach(jogador => {
                            html += `
                                <button class="btn btn-secondary" onclick="verPerfilPublico('${jogador.id}')">
                                    ${jogador.nome}
                                </button>
                            `;
                        });
                        content.innerHTML = html || '<p style="text-align: center;">Nenhum jogador encontrado.</p>';
                    } else {
                        content.innerHTML = `<div class="error">${result.message || 'Erro ao carregar jogadores'}</div>`;
                    }
                })
                .withFailureHandler(function(error) {
                    content.innerHTML = '<div class="error">Erro ao carregar jogadores. Tente novamente.</div>';
                    console.error('Jogadores error:', error);
                })
                .listJogadores();
        }

        // Ver perfil público
        function verPerfilPublico(id) {
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.ok) {
                        alert(`${result.avatar} ${result.nome}\n\n${result.status || 'Sem status definido'}`);
                    } else {
                        alert('Erro ao carregar perfil: ' + result.message);
                    }
                })
                .withFailureHandler(function(error) {
                    alert('Erro de conexão ao carregar perfil.');
                    console.error('Public profile error:', error);
                })
                .getPublicProfileById(id);
        }

        // Funções utilitárias
        function setLoading(btnId, textId, loaderId, loading) {
            const btn = document.getElementById(btnId);
            const text = document.getElementById(textId);
            const loader = document.getElementById(loaderId);
            
            btn.disabled = loading;
            text.style.display = loading ? 'none' : 'inline';
            loader.style.display = loading ? 'inline-block' : 'none';
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        function hideError(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => hideError(elementId), 5000);
        }

        // Prevenir zoom no iOS em inputs
        document.addEventListener('touchstart', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1');
                setTimeout(() => {
                    document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
                }, 500);
            }
        });
    </script>
</body>
</html>
